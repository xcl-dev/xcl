[package]
name = "xcl"
description = "Xbox Series X|S -> Windows compatibility layer (loader + HLE)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xcl"
path = "src/lib.rs"

[features]
pipeline-resolution-bench = []
texture-selection-bench = []
profile-tracy = ["dep:tracy-client"]

[[bin]]
name = "xcl"
path = "src/main.rs"

[[bin]]
name = "xcl-bench-compare"
path = "src/bin/bench_compare.rs"

[dependencies]
miniz_oxide = { version = "0.9", features = ["simd"] }
retour = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
windows-core = "0.62"
# local profiling only (not for a PR): `--features profile-tracy`. No crash handler: XCL's own
# vectored handlers must see the title's faults and illegal instructions first.
tracy-client = { version = "0.19", optional = true, default-features = false, features = ["enable", "sampling", "system-tracing", "context-switch-tracing", "code-transfer", "flush-on-exit", "demangle", "only-localhost", "manual-lifetime"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_Globalization",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
]

[[bench]]
name = "core"
harness = false

[[bench]]
name = "formats"
harness = false

[[bench]]
name = "gpu_cpu"
harness = false

[[bench]]
name = "runtime"
harness = false
